# Committed on purpose: the settings every clone must share. It must never hold a
# credential. npmAuthToken, npmAuthIdent, npmPassword and _auth belong in
# ~/.yarnrc.yml, and the pre-commit hook refuses a staged file that carries one.
# No npmRegistryServer here either: a project value would override a LAN mirror
# set in ~/.yarnrc.yml.
# enableScripts keeps Yarn 1's behaviour of running dependency install scripts:
# mongodb-client-encryption fetches its native binding in one, and Yarn 4.18
# no longer runs them by default.
nodeLinker: node-modules
enableScripts: true
enableTelemetry: false
