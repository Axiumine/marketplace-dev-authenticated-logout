# Committed on purpose: the settings every clone must share. It must never hold a
# credential. npmAuthToken, npmAuthIdent, npmPassword and _auth belong in
# ~/.yarnrc.yml, and the pre-commit hook refuses a staged file that carries one.
# No npmRegistryServer here either: a project value would override a LAN mirror
# set in ~/.yarnrc.yml.
# enableScripts is off: Yarn 4 runs no dependency's install script and reports each one it
# skips as YN0004. A package that needs its script is allow-listed in package.json, under
# "dependenciesMeta": { "<package>": { "built": true } }, with the reason in the commit body.
# Today that is mongodb-client-encryption alone (its install script fetches the native
# binding); esbuild, unrs-resolver, @apollo/protobufjs and postinstall-postinstall stay off.
# This project's own postinstall (the git hooks, patch-package) still runs.
nodeLinker: node-modules
enableScripts: false
enableTelemetry: false
