# CodeQL — the only static-analysis tool OpenSSF Scorecard's SAST check actually
# recognises for TypeScript.
#
# ⚠️ This does NOT replace the semgrep gate in .githooks/pre-push. Scorecard's SAST
# check matches tool names, never scan results: it looks for the literal
# `github/codeql-action/analyze` step (or sonar/snyk/pysa/qodana/hadolint), and has no
# entry for semgrep and no "a SARIF was uploaded" path at all. The vendored semgrep
# rules keep running locally before every push, where they always ran; this workflow
# exists alongside them, for the bug classes CodeQL's dataflow engine reaches and a
# pattern matcher does not.
#
# ⚠️ Pinned to commit SHAs. Scorecard's Pinned-Dependencies check grades this file.
#
# ⚠️ YAML forbids tabs — see the note in scorecard.yml.
name: CodeQL

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '30 2 * * 6'

permissions: read-all

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    # The organisation's own self-hosted runners, any of them (owner, 2026-11-28, ADR-061).
    # Never a GitHub-hosted label.
    runs-on: [self-hosted, Linux, X64]
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CodeQL's TypeScript extractor runs on Node, which GitHub's images carried and the
      # self-hosted runners do not.
      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Initialise CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:javascript-typescript'
