# OpenSSF Scorecard — supply-chain posture, scored weekly and on every merge to main.
#
# This file is byte-identical in all seventeen repos. It is the first GitHub Actions
# workflow the platform has ever had (ADR-054); every other gate is a local git hook.
#
# ⚠️ YAML forbids tabs.
#
# ⚠️ The trigger set is deliberately push + schedule and nothing else. Upstream
# supports exactly those two; pull_request and workflow_dispatch are marked
# experimental and branch_protection_rule is not documented at all, so neither is
# used even though both appear in copy-pasted examples elsewhere.
#
# ⚠️ Every `uses:` is pinned to a commit SHA, not a tag. Scorecard's own
# Pinned-Dependencies check grades this file, and a tag is mutable.
#
# ⚠️ `permissions: read-all` at workflow level plus the one write at job level is the
# shape Token-Permissions grades.
name: Scorecard supply-chain security

on:
  push:
    branches: ['main']
  schedule:
    # Saturday 01:30 UTC — upstream's own cadence, off the Monday-midnight congestion window.
    - cron: '30 1 * * 6'

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # The organisation's own self-hosted runners, any of them (owner, 2026-11-28, ADR-061).
    # Never a GitHub-hosted label.
    runs-on: [self-hosted, Linux, X64]
    permissions:
      # Upload the SARIF to the Security tab.
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Off: api.scorecard.dev accepts results from GitHub-hosted runners only, and this
          # platform runs its jobs on its own (ADR-061). The score is still enforced by the
          # floor in .githooks/pre-push, and the SARIF still reaches the Security tab.
          publish_results: false

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
